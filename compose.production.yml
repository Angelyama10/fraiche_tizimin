name: fraiche-production

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Define APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Define ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"

  postgres:
    image: postgres:17.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - data
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.50"

  redis:
    image: redis:7.4.9-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Define REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Define MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Define MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: https://${APP_DOMAIN:?Define APP_DOMAIN}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - edge
      - data
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.00"

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Define MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Define MINIO_ROOT_PASSWORD}
      STORAGE_PRIVATE_BUCKET: ${STORAGE_PRIVATE_BUCKET:-perfumes-private}
      STORAGE_PUBLIC_BUCKET: ${STORAGE_PUBLIC_BUCKET:-perfumes-media}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${STORAGE_PRIVATE_BUCKET}"
        mc mb --ignore-existing "local/$${STORAGE_PUBLIC_BUCKET}"
        mc anonymous set download "local/$${STORAGE_PUBLIC_BUCKET}"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  migrate:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: tools
    restart: "no"
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?Define POSTGRES_USER}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Define POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  seed:
    profiles: ["tools"]
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: tools
    restart: "no"
    command: ["./node_modules/.bin/tsx", "prisma/seed.ts"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?Define POSTGRES_USER}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Define POSTGRES_DB}?schema=public
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Define ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD}
      SEED_INVENTORY: ${SEED_INVENTORY:-true}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:?Define POSTGRES_USER}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Define POSTGRES_DB}?schema=public
      DB_POOL_MAX: ${DB_POOL_MAX:-30}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Define REDIS_PASSWORD}@redis:6379
      CORS_ORIGIN: https://${APP_DOMAIN:?Define APP_DOMAIN}
      PUBLIC_API_URL: https://api.${APP_DOMAIN:?Define APP_DOMAIN}
      WEB_APP_URL: https://${APP_DOMAIN:?Define APP_DOMAIN}
      WHATSAPP_PHONE: ${WHATSAPP_PHONE:?Define WHATSAPP_PHONE}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET}
      CUSTOMER_JWT_SECRET: ${CUSTOMER_JWT_SECRET:?Define CUSTOMER_JWT_SECRET}
      CUSTOMER_REFRESH_COOKIE_NAME: ${CUSTOMER_REFRESH_COOKIE_NAME:-fraiche_refresh}
      REQUIRE_EMAIL_VERIFICATION: "true"
      STORE_TIME_ZONE: ${STORE_TIME_ZONE:-America/Merida}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Define ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:?Define SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?Define SMTP_USER}
      SMTP_PASS: ${SMTP_PASS:?Define SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM:?Define SMTP_FROM}
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL:?Define ADMIN_NOTIFICATION_EMAIL}
      MERCADOPAGO_PUBLIC_KEY: ${MERCADOPAGO_PUBLIC_KEY:-}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:?Define MERCADOPAGO_ACCESS_TOKEN}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:?Define MERCADOPAGO_WEBHOOK_SECRET}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STORAGE_ENDPOINT: https://media.${APP_DOMAIN:?Define APP_DOMAIN}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_PRIVATE_BUCKET: ${STORAGE_PRIVATE_BUCKET:-perfumes-private}
      STORAGE_PRIVATE_URL: https://media.${APP_DOMAIN:?Define APP_DOMAIN}/${STORAGE_PRIVATE_BUCKET:-perfumes-private}
      STORAGE_PUBLIC_BUCKET: ${STORAGE_PUBLIC_BUCKET:-perfumes-media}
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:?Define MINIO_ROOT_USER}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Define MINIO_ROOT_PASSWORD}
      STORAGE_PUBLIC_URL: https://media.${APP_DOMAIN:?Define APP_DOMAIN}/${STORAGE_PUBLIC_BUCKET:-perfumes-media}
      ENABLE_SWAGGER: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    expose:
      - "4000"
    networks:
      - edge
      - data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "2.00"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: runtime
      args:
        API_INTERNAL_URL: http://127.0.0.1:9/api/v1
        NEXT_PUBLIC_API_URL: https://api.${APP_DOMAIN:?Define APP_DOMAIN}/api/v1
        NEXT_PUBLIC_WEB_URL: https://${APP_DOMAIN:?Define APP_DOMAIN}
        NEXT_PUBLIC_WHATSAPP_PHONE: ${WHATSAPP_PHONE:?Define WHATSAPP_PHONE}
        NEXT_PUBLIC_STORE_ADDRESS: ${STORE_ADDRESS:?Define STORE_ADDRESS}
        NEXT_PUBLIC_CONTACT_EMAIL: ${CONTACT_EMAIL:?Define CONTACT_EMAIL}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4000/api/v1
      NEXT_PUBLIC_API_URL: https://api.${APP_DOMAIN:?Define APP_DOMAIN}/api/v1
      NEXT_PUBLIC_WEB_URL: https://${APP_DOMAIN:?Define APP_DOMAIN}
      NEXT_PUBLIC_WHATSAPP_PHONE: ${WHATSAPP_PHONE:?Define WHATSAPP_PHONE}
      NEXT_PUBLIC_STORE_ADDRESS: ${STORE_ADDRESS:?Define STORE_ADDRESS}
      NEXT_PUBLIC_CONTACT_EMAIL: ${CONTACT_EMAIL:?Define CONTACT_EMAIL}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-}
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - next_cache:/app/.next/cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.00"

networks:
  edge:
  data:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  minio_data:
  next_cache:
