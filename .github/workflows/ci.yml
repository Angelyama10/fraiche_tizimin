name: Validacion continua

on:
  pull_request:
  push:
    branches: [main, feature/desarollo-backend]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql://build:build@localhost:5432/build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm test
      - run: npm run build

  web:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      API_INTERNAL_URL: http://127.0.0.1:9/api/v1
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000/api/v1
      NEXT_PUBLIC_WEB_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_WHATSAPP_PHONE: "529993020863"
      NEXT_PUBLIC_STORE_ADDRESS: Tizimin, Yucatan
      NEXT_PUBLIC_CONTACT_EMAIL: test@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  containers:
    name: Contenedores de produccion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp deploy/production.env.example deploy/production.env
      - run: sed -i 's/CHANGE_ME[^ ]*/ci-placeholder/g' deploy/production.env
      - run: docker compose --env-file deploy/production.env -f compose.production.yml config --quiet
      - run: docker compose --env-file deploy/production.env -f compose.production.yml build api web migrate seed
