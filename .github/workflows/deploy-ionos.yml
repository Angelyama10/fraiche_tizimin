name: Desplegar en IONOS

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Cargar INVENTARIO 3.0
        required: true
        default: false
        type: boolean
      reset_store_data:
        description: Respaldar y reemplazar la base comercial antes del seed
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "deploy-*"

permissions:
  contents: read

concurrency:
  group: ionos-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Produccion
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Validar configuracion de despliegue
        env:
          IONOS_HOST: ${{ secrets.IONOS_HOST }}
          IONOS_USER: ${{ secrets.IONOS_USER }}
          IONOS_DEPLOY_PATH: ${{ secrets.IONOS_DEPLOY_PATH }}
          SSH_PRIVATE_KEY: ${{ secrets.IONOS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.IONOS_KNOWN_HOSTS }}
        run: |
          missing=()
          for key in IONOS_HOST IONOS_USER IONOS_DEPLOY_PATH SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            if [[ -z "${!key}" ]]; then missing+=("$key"); fi
          done
          if (( ${#missing[@]} )); then
            printf 'Faltan secretos de produccion: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          if [[ "${IONOS_DEPLOY_PATH}" != '/opt/fraiche' ]]; then
            printf 'IONOS_DEPLOY_PATH debe ser exactamente /opt/fraiche. Valor recibido: %s\n' "${IONOS_DEPLOY_PATH}" >&2
            exit 1
          fi

      - name: Preparar acceso SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.IONOS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.IONOS_KNOWN_HOSTS }}
        run: |
          install -m 0700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ionos
          chmod 0600 ~/.ssh/ionos
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Verificar destino remoto
        env:
          IONOS_HOST: ${{ secrets.IONOS_HOST }}
          IONOS_USER: ${{ secrets.IONOS_USER }}
          IONOS_DEPLOY_PATH: ${{ secrets.IONOS_DEPLOY_PATH }}
          IONOS_PORT: 22022
        run: |
          ssh -p "${IONOS_PORT}" -i ~/.ssh/ionos "${IONOS_USER}@${IONOS_HOST}" \
            "test '${IONOS_DEPLOY_PATH}' = '/opt/fraiche' && test -f '/opt/fraiche/compose.production.yml' && test -f '/opt/fraiche/deploy/production.env'"

      - name: Sincronizar codigo
        env:
          IONOS_HOST: ${{ secrets.IONOS_HOST }}
          IONOS_USER: ${{ secrets.IONOS_USER }}
          IONOS_DEPLOY_PATH: ${{ secrets.IONOS_DEPLOY_PATH }}
          IONOS_PORT: 22022
        run: |
          rsync -rlpzc --delete-delay --itemize-changes \
            --exclude-from='.deployignore' \
            -e "ssh -p ${IONOS_PORT} -i ~/.ssh/ionos" \
            ./ "${IONOS_USER}@${IONOS_HOST}:${IONOS_DEPLOY_PATH}/"

      - name: Publicar aplicacion
        env:
          IONOS_HOST: ${{ secrets.IONOS_HOST }}
          IONOS_USER: ${{ secrets.IONOS_USER }}
          IONOS_DEPLOY_PATH: ${{ secrets.IONOS_DEPLOY_PATH }}
          IONOS_PORT: 22022
          RUN_SEED: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'deploy-reset-') || inputs.seed }}
          RESET_STORE_DATA: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'deploy-reset-') || inputs.reset_store_data }}
        run: |
          seed_flag=''
          reset_flag=''
          if [[ "$RUN_SEED" == 'true' ]]; then seed_flag='--seed'; fi
          if [[ "$RESET_STORE_DATA" == 'true' ]]; then reset_flag='--reset-store-data'; fi
          ssh -p "${IONOS_PORT}" -i ~/.ssh/ionos "${IONOS_USER}@${IONOS_HOST}" \
            "cd '${IONOS_DEPLOY_PATH}' && chmod +x deploy/*.sh && ./deploy/deploy.sh ${seed_flag} ${reset_flag}"
