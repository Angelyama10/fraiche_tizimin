name: tienda-perfumes

services:
  postgres:
    image: postgres:17-alpine
    container_name: tienda-perfumes-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: perfumes
      POSTGRES_USER: perfumes
      POSTGRES_PASSWORD: perfumes_dev_password
    ports:
      - "5432:5432"
    volumes:
      - perfumes_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perfumes -d perfumes"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tienda-perfumes-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - perfumes_redis_data:/data

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: tienda-perfumes-api
    init: true
    working_dir: /app
    command: sh -c "npm install && npx prisma generate && npx prisma migrate deploy && npx tsx prisma/seed.ts && npm run start:dev"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://perfumes:perfumes_dev_password@postgres:5432/perfumes?schema=public
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:3000
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:3000}
      WHATSAPP_PHONE: ${WHATSAPP_PHONE:-529861000000}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-before-production}
      CUSTOMER_JWT_SECRET: ${CUSTOMER_JWT_SECRET:-dev-customer-only-change-before-production}
      CUSTOMER_REFRESH_COOKIE_NAME: ${CUSTOMER_REFRESH_COOKIE_NAME:-fraiche_refresh}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      STORE_TIME_ZONE: ${STORE_TIME_ZONE:-America/Merida}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL:-}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_REGION: ${STORAGE_REGION:-auto}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-}
    ports:
      - "4000:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    volumes:
      - ./apps/api:/app
      - api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    container_name: tienda-perfumes-web
    init: true
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      API_INTERNAL_URL: http://api:4000/api/v1
      NEXT_PUBLIC_WEB_URL: http://localhost:3000
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    depends_on:
      api:
        condition: service_healthy

volumes:
  perfumes_postgres_data:
  perfumes_redis_data:
  api_node_modules:
  web_node_modules:
  web_next:
